name: Publicar PWA no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_pwa/package-lock.json

      - name: Instalar dependências
        working-directory: frontend_pwa
        run: npm ci

      - name: Validar configuração da API
        env:
          VITE_GAS_API_URL: ${{ vars.VITE_GAS_API_URL }}
        run: |
          if [ -z "$VITE_GAS_API_URL" ]; then
            echo "::error::Configure a variável VITE_GAS_API_URL nas configurações do repositório."
            exit 1
          fi

      - name: Gerar versão de produção
        working-directory: frontend_pwa
        env:
          VITE_GAS_API_URL: ${{ vars.VITE_GAS_API_URL }}
        run: npm run build

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend_pwa/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
