
name: Deploy Development to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend_pwa/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: frontend_pwa

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_pwa/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de desenvolvimento
        run: npm run build -- --base=/adel-coco-compras/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend_pwa/dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
